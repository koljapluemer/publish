<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script data-thea-bridge>(() => {
  const post = (m) => { if (parent !== window) parent.postMessage({ source: 'thea', ...m }, '*'); };
  const apply = (mode) => { document.documentElement.dataset.theme = mode; document.documentElement.style.colorScheme = mode; };
  apply(matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  addEventListener('message', (e) => { if (e.source === parent && e.data && e.data.type === 'theme') apply(e.data.mode === 'dark' ? 'dark' : 'light'); });
  addEventListener('error', (e) => post({ type: 'error', message: String(e.message || e.error) }));
  addEventListener('unhandledrejection', (e) => post({ type: 'error', message: String((e.reason && e.reason.message) || e.reason) }));
  const size = () => post({ type: 'resize', height: Math.ceil(document.documentElement.getBoundingClientRect().height) });
  addEventListener('DOMContentLoaded', () => { new ResizeObserver(size).observe(document.documentElement); size(); });
})();</script>
<style>html, body { margin: 0; }
:root { --viz-bg: transparent; --viz-surface: #f4f4f5; --viz-fg: #18181b; --viz-muted: #71717a; --viz-border: #e4e4e7;

  --viz-font: system-ui, "Noto Sans", "DejaVu Sans", sans-serif; --viz-mono: ui-monospace, "DejaVu Sans Mono", monospace;
  color: var(--viz-fg); background: var(--viz-bg); font: 15px/1.5 var(--viz-font); }
:root[data-theme="dark"] { --viz-surface: #27272a; --viz-fg: #f4f4f5; --viz-muted: #a1a1aa; --viz-border: #3f3f46;

<style>.psnr{--heat: #ef4444;color:var(--viz-fg);font-family:var(--viz-font);display:flex;flex-direction:column;gap:14px;padding:4px 0}.psnr .panels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(6px,2vw,16px)}.psnr figure{margin:0;min-width:0}.psnr canvas{display:block;width:100%;aspect-ratio:1;height:auto;image-rendering:pixelated;border-radius:4px;background:var(--viz-surface)}.psnr figcaption{font-size:12.5px;color:var(--viz-muted);margin-top:5px;line-height:1.3}.psnr .tag{font-family:var(--viz-mono);font-size:11px;border:1px solid var(--viz-border);border-radius:3px;padding:0 4px;margin-left:2px}.psnr .controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.psnr button{font:inherit;font-size:14px;padding:5px 14px;border-radius:6px;border:1px solid var(--viz-border);background:var(--viz-surface);color:var(--viz-fg);cursor:pointer}.psnr button:hover{border-color:var(--viz-muted)}.psnr button:disabled{opacity:.45;cursor:default}.psnr button.primary{background:var(--viz-accent);border-color:var(--viz-accent);color:#fff;min-width:76px}:root[data-theme=dark] .psnr button.primary{color:#0b1220}.psnr button:focus-visible,.psnr input:focus-visible{outline:2px solid var(--viz-accent);outline-offset:2px}.psnr .speed{display:flex;align-items:center;gap:8px;flex:1 1 200px;min-width:0;font-size:13px;color:var(--viz-muted)}.psnr .speed input{flex:1;min-width:80px;accent-color:var(--viz-accent)}.psnr .speed output{font-family:var(--viz-mono);font-size:12px;min-width:7.5em;text-align:right;color:var(--viz-fg)}.psnr .lower{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:16px}@media(max-width:560px){.psnr .lower{grid-template-columns:minmax(0,1fr)}}.psnr section{border:1px solid var(--viz-border);border-radius:8px;padding:10px 12px;min-width:0}.psnr .head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 8px;font-size:13px;margin-bottom:8px}.psnr .head b{font-family:var(--viz-mono);font-weight:600}.psnr .muted{color:var(--viz-muted);font-size:12px}.psnr .kgrid{display:grid;gap:2px;max-width:230px}.psnr .kgrid .cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-family:var(--viz-mono);font-size:clamp(9px,2.6vw,12px);border-radius:3px;background:var(--viz-surface);color:var(--viz-fg);position:relative;overflow:hidden}.psnr .kgrid .cell span{position:relative}.psnr .kgrid .cell i{position:absolute;inset:0;background:var(--heat)}.psnr .ksum{margin-top:8px;font-size:13px;color:var(--viz-muted)}.psnr .ksum b{color:var(--viz-fg);font-family:var(--viz-mono);font-weight:600}.psnr .progress{height:4px;background:var(--viz-surface);border-radius:2px;overflow:hidden;margin-bottom:10px}.psnr .progress div{height:100%;width:0;background:var(--viz-accent)}.psnr dl{margin:0;display:flex;flex-direction:column;gap:6px}.psnr dl>div{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px;border-bottom:1px dashed var(--viz-border);padding-bottom:5px}.psnr dt{color:var(--viz-muted)}.psnr dd{margin:0;font-family:var(--viz-mono);white-space:nowrap}.psnr dl>div.big{border-bottom:0}.psnr dl>div.big dd{font-size:20px;font-weight:600;color:var(--viz-accent)}.psnr .note{margin:6px 0 0;font-size:12.5px;color:var(--viz-muted);line-height:1.4}
</style>

<body>
<div id="app" class="psnr">
  <div class="panels">
    <figure>
      <canvas id="cv-a" width="400" height="400" aria-label="Original image"></canvas>
      <figcaption>Original <span class="tag">A</span></figcaption>
    </figure>
    <figure>
      <canvas id="cv-b" width="400" height="400" aria-label="Compressed image"></canvas>
      <figcaption>Compressed <span class="tag">B</span></figcaption>
    </figure>
    <figure>
      <canvas id="cv-d" width="400" height="400" aria-label="Squared error map"></canvas>
      <figcaption>Squared error (A−B)²</figcaption>
    </figure>
  </div>

  <div class="controls">
    <button id="btn-play" class="primary" type="button">Start</button>
    <button id="btn-step" type="button">Step</button>
    <button id="btn-reset" type="button">Reset</button>
    <label class="speed">
      <span>Speed</span>
      <input id="speed" type="range" min="0" max="100" value="45" />
      <output id="speed-out">—</output>
    </label>
  </div>

  <div class="lower">
    <section class="kernel">
      <div class="head">
        <span>Kernel at <b id="k-pos">—</b></span>
        <span class="muted">mean of R,G,B squared error</span>
      </div>
      <div id="k-grid" class="kgrid"></div>
      <div class="ksum">Added to Σ (all 3 channels) <b id="k-sum">—</b></div>
    </section>
    <section class="stats">
      <div class="progress"><div id="prog-bar"></div></div>
      <dl>
        <div><dt>Pixels compared</dt><dd id="s-n">0 / 0</dd></div>
        <div><dt>Sum of squared errors</dt><dd id="s-sse">0</dd></div>
        <div><dt>MSE = Σ / (N·3)</dt><dd id="s-mse">—</dd></div>
        <div class="big"><dt>PSNR = 10·log₁₀(255² / MSE)</dt><dd id="s-psnr">—</dd></div>
      </dl>
      <p class="note" id="s-note">Press Start to slide the kernel across both images.</p>
    </section>
  </div>
</div>
