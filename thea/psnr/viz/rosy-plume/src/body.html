<div id="app" class="psnr">
  <div class="panels">
    <figure>
      <canvas id="cv-a" width="400" height="400" aria-label="Original image"></canvas>
      <figcaption>Original</figcaption>
    </figure>
    <figure>
      <canvas id="cv-b" width="400" height="400" aria-label="Compressed image"></canvas>
      <figcaption>Compressed</figcaption>
    </figure>
    <figure>
      <canvas id="cv-d" width="400" height="400" aria-label="Squared difference heatmap"></canvas>
      <figcaption>Difference² <span class="read" id="readout"></span></figcaption>
    </figure>
  </div>

  <div class="controls">
    <button id="btn-play" class="primary" type="button">Start</button>
    <button id="btn-reset" type="button">Reset</button>
    <label class="speed">
      <span>Speed</span>
      <input id="speed" type="range" min="0" max="100" value="55" />
      <output id="speed-out">—</output>
    </label>
  </div>
</div>
