[project]
name = "publish-editor"
version = "0.1.0"
description = "Editor for the docs under thea/ and their generated viz blocks; renders the repo's Markdown to PDF"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1",
    "playwright>=1.55",
    "pypandoc-binary>=1.17",
    "python-frontmatter>=1.3.0",
    "typst>=0.15.2",
    "watchdog>=7.1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
